# Pubblica su npm:
#  - automaticamente al push di un tag vX.Y.Z (deve coincidere con "version" in package.json)
#  - manualmente da Actions > Publish to npm > Run workflow (pubblica la versione di package.json)
# Autenticazione: npm Trusted Publishing (OIDC), nessun token e nessuna 2FA da inserire.
# Su npmjs.com > pacchetto > Settings > Trusted Publisher > GitHub Actions:
#   owner marcostoduto, repository n8n-nodes-ubiquiti-access, workflow publish.yml
# La provenance viene generata automaticamente.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessario per --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verifica versione
        if: github.event_name == 'push'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Il tag $GITHUB_REF_NAME non coincide con package.json ($PKG)"; exit 1
          fi

      - name: Aggiorna npm (Trusted Publishing richiede npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Installa dipendenze di sviluppo
        run: npm install --no-audit --no-fund

      - name: Build e test (contro un finto UniFi Access)
        run: npm test

      - name: Publish
        run: npm publish --access public
